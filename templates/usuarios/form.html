{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 30px; background-color: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-family: system-ui, -apple-system, sans-serif;">
    
    <h2 style="font-size: 24px; font-weight: bold; color: #1f2937; margin-bottom: 20px; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px;">
        {{ titulo }}
    </h2>

    {% if form.errors %}
        <div style="background-color: #fee2e2; color: #991b1b; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-weight: bold;">
            ⚠️ Por favor corrige los errores indicados abajo.
        </div>
    {% endif %}

    <form method="POST" style="display: flex; flex-direction: column;">
        {% csrf_token %}
        
        <style>
            form p { margin-bottom: 18px; display: flex; flex-direction: column; }
            form label { font-weight: bold; margin-bottom: 6px; color: #374151; }
            form input, form select { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; width: 100%; box-sizing: border-box; outline: none; }
            form input:focus, form select:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2); }
            form .helptext { font-size: 12px; color: #6b7280; margin-top: 6px; font-style: italic; }
            form ul.errorlist { color: #dc2626; font-size: 13px; font-weight: bold; margin-top: 5px; padding-left: 0; list-style: none; }
        </style>

        {{ form.as_p }}

        <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 25px; border-top: 1px solid #f3f4f6; padding-top: 20px;">
            <a href="{% url 'lista_usuarios' %}" style="background-color: #9ca3af; color: white; font-weight: bold; padding: 10px 20px; border-radius: 6px; text-decoration: none; text-align: center; transition: background-color 0.2s;">
                Cancelar
            </a>
            <button type="submit" style="background-color: #4f46e5; color: white; font-weight: bold; padding: 10px 25px; border-radius: 6px; border: none; cursor: pointer; font-size: 16px; transition: background-color 0.2s;">
                Guardar Personal
            </button>
        </div>
    </form>
</div>
{% endblock %}
