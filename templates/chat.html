<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asistente Inteligente Aduanero</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f1f5f9; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-w-3xl; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 85vh; max-width: 800px;}
        .chat-header { background: #0f172a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-limpiar { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-limpiar:hover { background: #dc2626; }
        .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; }
        .msg-usuario { background: #dbeafe; color: #1e3a8a; align-self: flex-end; border-bottom-right-radius: 0; }
        .msg-ia { background: #f1f5f9; color: #334155; align-self: flex-start; border-bottom-left-radius: 0; border: 1px solid #e2e8f0; }
        .sugerencias { display: flex; gap: 10px; padding: 10px 20px; background: #f8fafc; overflow-x: auto; border-top: 1px solid #e2e8f0; }
        .btn-sugerencia { background: white; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 20px; font-size: 13px; color: #475569; cursor: pointer; white-space: nowrap; }
        .btn-sugerencia:hover { background: #e2e8f0; }
        .chat-input-area { display: flex; padding: 15px 20px; background: white; border-top: 1px solid #e2e8f0; gap: 10px; }
        .chat-input { flex-grow: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
        .btn-enviar { background: #2563eb; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-enviar:hover { background: #1d4ed8; }
        .btn-volver { color: #94a3b8; text-decoration: none; font-size: 14px; }
        .btn-volver:hover { color: white; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div>
                <a href="{% url 'home' %}" class="btn-volver">⬅ Volver al Menú</a>
                <h2 style="margin: 5px 0 0 0; font-size: 18px;">🤖 Asistente Inteligente Sisa</h2>
            </div>
            <button class="btn-limpiar" onclick="limpiarChat()">🗑️ Limpiar Chat</button>
        </div>

        <div class="chat-messages" id="cajaMensajes">
            <div class="message msg-ia">
                <strong>Sisa:</strong> ¡Hola! Soy tu asistente aduanero. ¿En qué puedo ayudarte hoy? Consulta sobre aranceles, documentos o porcentajes.
            </div>
        </div>

        <div class="sugerencias">
            <button class="btn-sugerencia" onclick="usarSugerencia('Mostrar aranceles del Capítulo 02')">Capítulo 02</button>
            <button class="btn-sugerencia" onclick="usarSugerencia('¿Qué arancel tiene la importación de caballos?')">Caballos</button>
            <button class="btn-sugerencia" onclick="usarSugerencia('¿Qué partidas requieren autorización del SENASAG?')">Doc. SENASAG</button>
        </div>

        <div class="chat-input-area">
            {% csrf_token %} <input type="text" id="inputPregunta" class="chat-input" placeholder="Escribe tu consulta aquí..." onkeypress="manejarEnter(event)">
            <button class="btn-enviar" onclick="enviarMensaje()">Enviar ➔</button>
        </div>
    </div>

    <script>
        const cajaMensajes = document.getElementById('cajaMensajes');
        const inputPregunta = document.getElementById('inputPregunta');
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        // Función para colocar texto de sugerencia en el chat
        function usarSugerencia(texto) {
            inputPregunta.value = texto;
            inputPregunta.focus();
        }

        // Función para limpiar la pantalla
        function limpiarChat() {
            cajaMensajes.innerHTML = `
                <div class="message msg-ia">
                    <strong>Sisa:</strong> Chat limpiado. El contexto anterior ha sido borrado. ¿Qué nueva consulta tienes?
                </div>
            `;
        }

        function manejarEnter(e) {
            if (e.key === 'Enter') enviarMensaje();
        }

        async function enviarMensaje() {
            const pregunta = inputPregunta.value.trim();
            if (!pregunta) return;

            // 1. Mostrar mensaje del usuario
            cajaMensajes.innerHTML += `<div class="message msg-usuario">${pregunta}</div>`;
            inputPregunta.value = '';
            
            // 2. Mostrar mensaje de "Escribiendo..."
            const idCarga = 'carga-' + Date.now();
            cajaMensajes.innerHTML += `<div id="${idCarga}" class="message msg-ia"><em>Consultando base de datos... ⏳</em></div>`;
            cajaMensajes.scrollTop = cajaMensajes.scrollHeight;

            // 3. Enviar datos a Django (Tu vista chat_inteligente)
            const formData = new FormData();
            formData.append('pregunta', pregunta);

            try {
                const respuesta = await fetch("{% url 'chat_ia' %}", {
                    method: 'POST',
                    headers: { 'X-CSRFToken': csrfToken },
                    body: formData
                });
                
                const data = await respuesta.json();
                
                // 4. Quitar mensaje de carga y mostrar respuesta real
                document.getElementById(idCarga).remove();
                
                // Formatear viñetas simples y saltos de línea
                const textoFormateado = data.respuesta.replace(/\n/g, '<br>').replace(/\*/g, '•');
                
                // AQUÍ SE MUESTRA EL NOMBRE "Sisa" EN LAS RESPUESTAS
                cajaMensajes.innerHTML += `<div class="message msg-ia"><strong>Sisa:</strong><br>${textoFormateado}</div>`;
                
            } catch (error) {
                document.getElementById(idCarga).remove();
                cajaMensajes.innerHTML += `<div class="message msg-ia" style="color: red;">Error de conexión. Intenta de nuevo.</div>`;
            }
            
            cajaMensajes.scrollTop = cajaMensajes.scrollHeight;
        }
    </script>
</body>
</html>
